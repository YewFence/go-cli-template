[tools]
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
ko = "latest"

[tasks."vuln:check"]
description = "Run Go vulnerability checks"
run = "govulncheck ./..."

[tasks.'mod:verify']
description = "Verify Go module dependencies"
run = "go mod verify"

[tasks.'actions:pin:check']
# Need github token to avoid rate limit
description = "Check for action pinned version"
run = "pinact run --check"

[tasks.'actions:outdated']
# Need github token to avoid rate limit
description = "Check for outdated action versions"
run = "pinact run --update --diff"

[tasks.'release:version']
description = "Print the next release version without the v prefix"
shell = "bash -c"
run = """
version="$(git cliff --bumped-version)"
version="${version#v}"
if [[ -z "${version}" ]]; then
  echo "git cliff did not resolve a version"
  exit 1
fi

printf '%s\\n' "${version}"
"""

[tasks.'release:tag']
description = "Print the release tag, automatically generate if RELEASE_TAG is not set"
shell = "bash -c"
run = """
tag="${RELEASE_TAG:-}"
if [[ -z "${tag}" ]]; then
  version="$(mise run release:version)"
  tag="v${version}"
fi
printf '%s\\n' "${tag}"
"""

[tasks.'release:notes']
description = "Generate release notes for RELEASE_TAG, or for the next release tag"
shell = "bash -c"
run = """
tag="$(mise run release:tag)"

cliff_mode="--unreleased"
if git tag --points-at HEAD | grep -Fxq "${tag}"; then
  cliff_mode="--current"
fi

output="${RELEASE_NOTES_OUTPUT:-}"
if [[ -n "${output}" ]]; then
  mkdir -p "$(dirname "${output}")"
  git cliff "${cliff_mode}" --tag "${tag}" --strip all > "${output}"

  if [[ ! -s "${output}" ]]; then
    echo "Release ${tag}" > "${output}"
  fi
else
  git cliff "${cliff_mode}" --tag "${tag}" --strip all
fi
"""

[tasks.'release:changelog']
description = "Update CHANGELOG.md for RELEASE_TAG, or for the next release tag"
shell = "bash -c"
run = """
tag="$(mise run release:tag)"

if [[ -f CHANGELOG.md ]]; then
  git cliff --unreleased --tag "${tag}" --prepend CHANGELOG.md
else
  git cliff --unreleased --tag "${tag}" --output CHANGELOG.md
fi
"""

[tasks.'release:tag:create']
description = "Create the release tag for RELEASE_TAG, or for the next release tag"
shell = "bash -c"
run = """
tag="$(mise run release:tag)"

if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
  existing_commit="$(git rev-list -n 1 "${tag}")"
  current_commit="$(git rev-parse HEAD)"
  if [[ "${existing_commit}" != "${current_commit}" ]]; then
    echo "tag ${tag} already exists, but it does not point to the current commit"
    exit 1
  fi
  echo "tag ${tag} already exists. Skipping tag creation"
else
  git tag -a "${tag}" -m "Release ${tag}"
fi
"""

[tasks.'release:package']
description = "Package the built CLI artifact for a release"
file = "scripts/release-package.sh"

[tasks.'release:container:build']
description = "Build the CLI container image without publishing"
shell = "bash -c"
run = """
set -euo pipefail

version="${BUILD_VERSION:-dev}"
tag="${RELEASE_TAG:-v${version}}"
repo="${KO_DOCKER_REPO:-}"
if [[ -z "${repo}" ]]; then
  if [[ -n "${GITHUB_REPOSITORY:-}" ]]; then
    repo="ghcr.io/${GITHUB_REPOSITORY,,}"
  else
    repo="ghcr.io/example/your-cli"
  fi
fi
repo="${repo,,}"

KO_DOCKER_REPO="${repo}" ko build ./cmd/your-cli \
  --push=false \
  --bare \
  --tags "${tag}" \
  --platform "${KO_PLATFORMS:-linux/amd64}" \
  --ldflags "-s -w -X main.version=${version}"
"""

[tasks.'release:container:publish']
description = "Publish the CLI container image"
shell = "bash -c"
run = """
set -euo pipefail

tag="${RELEASE_TAG:?RELEASE_TAG must be set}"
version="${tag#v}"
repo="${KO_DOCKER_REPO:-}"
if [[ -z "${repo}" ]]; then
  if [[ -z "${GITHUB_REPOSITORY:-}" ]]; then
    echo "KO_DOCKER_REPO or GITHUB_REPOSITORY must be set"
    exit 1
  fi
  repo="ghcr.io/${GITHUB_REPOSITORY,,}"
fi
repo="${repo,,}"

registry="${KO_REGISTRY:-${repo%%/*}}"
registry="${registry,,}"
username="${KO_REGISTRY_USERNAME:-}"
password="${KO_REGISTRY_PASSWORD:-}"
if [[ -z "${username}" && -n "${password}" && "${registry}" == "ghcr.io" ]]; then
  username="${GITHUB_ACTOR:-}"
fi
if [[ -z "${username}" && -z "${password}" && "${registry}" == "ghcr.io" && -n "${GITHUB_TOKEN:-}" && -n "${GITHUB_ACTOR:-}" ]]; then
  username="${GITHUB_ACTOR}"
  password="${GITHUB_TOKEN}"
fi

if [[ -n "${username}" || -n "${password}" ]]; then
  if [[ -z "${username}" || -z "${password}" ]]; then
    echo "KO_REGISTRY_USERNAME and KO_REGISTRY_PASSWORD must be set together"
    exit 1
  fi
  printf '%s' "${password}" | ko login "${registry}" --username "${username}" --password-stdin
fi

args=(
  ./cmd/your-cli
  --bare
  --tags "${tag}"
  --tags "${version}"
  --platform "${KO_PLATFORMS:-linux/amd64,linux/arm64}"
  --ldflags "-s -w -X main.version=${version}"
)
if [[ -n "${KO_IMAGE_REFS_OUTPUT:-}" ]]; then
  args+=(--image-refs "${KO_IMAGE_REFS_OUTPUT}")
fi

KO_DOCKER_REPO="${repo}" ko build "${args[@]}"
"""
