[settings]
lockfile = true

[tools]
# https://go.dev/
go = "1"
# https://nodejs.org/
node = "26"
# https://github.com/paulhatch/semantic-version
"npm:@semanticversion/cli" = "6"
# https://pnpm.io/
pnpm = "11"
# https://golangci-lint.run/
golangci-lint = "2"
# https://github.com/suzuki-shunsuke/nllint
"go:github.com/suzuki-shunsuke/nllint/cmd/nllint" = "1"
# https://github.com/suzuki-shunsuke/pinact
pinact = "4"
# https://github.com/crate-ci/typos
typos = "1"

[env]
# the minimum release age of github actions in days
PINACT_MIN_AGE = "3"

[tasks.init]
description = "Initialize project name, module path, and repository information from the template"
run = "GO111MODULE=off go run ./tools/init-template/main.go --fresh-git"

[tasks.tidy]
description = "Tidy Go module dependencies"
run = "go mod tidy"

[tasks.update]
description = "Update Go dependencies and tidy modules"
run = "go get -u ./... && go mod tidy"

[tasks.test]
description = "Run Go tests"
run = "go test -v ./..."

[tasks.fmt]
description = "Check Go code formatting"
raw = true
run = "golangci-lint fmt -E gofmt --diff"

[tasks.lint]
description = "Run Go lint checks"
raw = true
run = "golangci-lint run -E asciicheck"

[tasks."lint:typos"]
description = "Run Typos Lint"
run = "typos"

[tasks."lint:typos-fix"]
description = "Fix Typos Lint"
run = "typos --write-changes"

[tasks."lint:newline"]
description = "Run Newline Lint and fix issues"
run = "git ls-files | xargs nllint --fix --trim-space"

[tasks.check]
description = """
Run Newline Check, typos check
auto tidy go mod
go formatting checks and static checks via golang-lint
go build and test"""
depends = [ "fmt", "tidy"]
run = [
  { task = "lint:newline" },
  { task = "lint:typos"},
  { task = "lint" },
  { task = "build" },
  { task = "test" },
]

[tasks.cli]
description = "Run the CLI"
run = "go run ./cmd/..."

[tasks.'cli:install']
description = "Install the CLI into the local Go bin directory"
run = 'go install -trimpath -ldflags="-X main.version=${BUILD_VERSION:-dev}" ./cmd/...'

[tasks.build]
description = "Build the CLI executable"
run = 'go build -trimpath -ldflags="-s -w -X main.version=${BUILD_VERSION:-dev}" -o "${BUILD_OUTPUT_DIR:-bin}/" ./cmd/...'

[tasks.'action:update']
description = "Update GitHub Action versions and pin to commit hashest"
env = { PINACT_GITHUB_TOKEN = "${MISE_GITHUB_TOKEN:-}" }
run = "pinact run --update"

[tasks.'docs:install']
description = "Install documentation site dependencies"
dir = "docs"
run = "pnpm install"

[tasks.'docs:dev']
description = "Start the VitePress documentation site"
depends = ["docs:install"]
dir = "docs"
run = "pnpm dev"

[tasks.'docs:build']
description = "Build the VitePress documentation site"
depends = ["docs:install"]
dir = "docs"
run = "pnpm build"

[tasks.'docs:preview']
description = "Preview the VitePress documentation site"
depends = ["docs:install"]
dir = "docs"
run = "pnpm preview"
